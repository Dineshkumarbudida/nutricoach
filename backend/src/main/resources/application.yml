spring:
  application:
    name: nutricoach-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nutricoach}
    username: ${DATABASE_USER:nutricoach}
    password: ${DATABASE_PASSWORD:nutricoach-local-only}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  application:
    name: NutriCoach
    milestone: foundation
    authoritative-calculations: deterministic-code

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
