name: ${COMPOSE_PROJECT_NAME:-nutricoach}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  database:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutricoach}
      POSTGRES_USER: ${POSTGRES_USER:-nutricoach}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - nutricoach-postgres:/var/lib/postgresql
    shm_size: 128mb
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - nutricoach-data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-nutricoach}
      DATABASE_USER: ${POSTGRES_USER:-nutricoach}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      SERVER_PORT: 8080
    secrets:
      - postgres_password
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    logging: *default-logging
    networks:
      - nutricoach-data
      - nutricoach-app

  web:
    build:
      context: ./web
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8081}:8081"
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *default-logging
    networks:
      - nutricoach-app

secrets:
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  nutricoach-postgres:

networks:
  nutricoach-data:
    driver: bridge
    internal: true
  nutricoach-app:
    driver: bridge
