name: Runtime smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-stack-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: nutricoach
          POSTGRES_USER: nutricoach
          POSTGRES_PASSWORD: nutricoach-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutricoach -d nutricoach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Build, start, and exercise the full stack
        env:
          DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/nutricoach
          DATABASE_USER: nutricoach
          DATABASE_PASSWORD: nutricoach-ci-only
          DATABASE_POOL_SIZE: '4'
          SERVER_PORT: '8080'
        run: |
          set -Eeuo pipefail

          BACKEND_LOG="${RUNNER_TEMP}/nutricoach-backend.log"
          WEB_LOG="${RUNNER_TEMP}/nutricoach-web.log"
          BACKEND_PID=""
          WEB_PID=""

          cleanup() {
            if [[ -n "${WEB_PID}" ]]; then
              kill "${WEB_PID}" 2>/dev/null || true
            fi
            if [[ -n "${BACKEND_PID}" ]]; then
              kill "${BACKEND_PID}" 2>/dev/null || true
            fi
          }

          finish() {
            status=$?
            if [[ ${status} -ne 0 ]]; then
              echo "--- backend log ---"
              cat "${BACKEND_LOG}" 2>/dev/null || true
              echo "--- web log ---"
              cat "${WEB_LOG}" 2>/dev/null || true
            fi
            cleanup
            exit ${status}
          }

          wait_for_url() {
            name="$1"
            url="$2"
            attempts="$3"
            for ((attempt = 1; attempt <= attempts; attempt++)); do
              if curl --fail --silent --show-error "${url}" >/dev/null 2>&1; then
                echo "${name} is ready: ${url}"
                return 0
              fi
              sleep 2
            done
            echo "${name} did not become ready: ${url}" >&2
            return 1
          }

          trap finish EXIT

          echo "Building backend..."
          mvn -B -ntp -f backend/pom.xml -DskipTests package

          echo "Starting backend..."
          java -jar backend/target/nutricoach-api-0.1.0-SNAPSHOT.jar >"${BACKEND_LOG}" 2>&1 &
          BACKEND_PID=$!
          wait_for_url "Backend health endpoint" "http://127.0.0.1:8080/actuator/health" 60

          curl --fail --silent --show-error \
            "http://127.0.0.1:8080/api/v1/meta" \
            --output "${RUNNER_TEMP}/backend-meta.json"

          cat >"${RUNNER_TEMP}/portion-request.json" <<'JSON'
          {
            "food": {
              "foodId": "runtime-smoke-fixture",
              "version": "1",
              "displayName": "Synthetic runtime fixture",
              "referenceMassGrams": 100,
              "nutrients": {
                "ENERGY": {"status": "MEASURED", "amount": 100, "reportingLimit": null},
                "PROTEIN": {"status": "MEASURED", "amount": 10, "reportingLimit": null},
                "CARBOHYDRATE": {"status": "MEASURED", "amount": 20, "reportingLimit": null},
                "FAT": {"status": "MEASURED", "amount": 2, "reportingLimit": null},
                "FIBER": {"status": "MISSING", "amount": null, "reportingLimit": null}
              },
              "source": {
                "sourceCode": "runtime-smoke",
                "sourceVersion": "1",
                "sourceRecordId": "fixture-1",
                "licenseExpression": "TEST-ONLY"
              }
            },
            "portionMassGrams": 250
          }
          JSON

          curl --fail --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data @"${RUNNER_TEMP}/portion-request.json" \
            "http://127.0.0.1:8080/api/v1/calculations/food-portions" \
            --output "${RUNNER_TEMP}/backend-result.json"

          python3 - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path
          import os

          temp = Path(os.environ["RUNNER_TEMP"])
          meta = json.loads((temp / "backend-meta.json").read_text())
          result = json.loads((temp / "backend-result.json").read_text())

          assert meta["application"] == "NutriCoach"
          assert meta["authoritativeCalculations"] == "deterministic-code"
          assert result["calculationType"] == "FOOD_PORTION"
          assert Decimal(str(result["basisMassGrams"])) == Decimal("250")
          assert Decimal(str(result["totals"]["ENERGY"]["knownAmount"])) == Decimal("250")
          assert Decimal(str(result["totals"]["PROTEIN"]["knownAmount"])) == Decimal("25")
          assert result["totals"]["FIBER"]["completeness"] == "UNBOUNDED_INCOMPLETE"
          print("Backend calculation endpoint returned the expected deterministic result.")
          PY

          echo "Building frontend..."
          pushd web >/dev/null
          npm install --no-audit --no-fund
          npm run build

          echo "Starting frontend development server..."
          npm run dev -- --host 127.0.0.1 >"${WEB_LOG}" 2>&1 &
          WEB_PID=$!
          popd >/dev/null

          wait_for_url "Frontend" "http://127.0.0.1:5173/" 40
          curl --fail --silent --show-error "http://127.0.0.1:5173/" | grep -q "NutriCoach Foundation"

          curl --fail --silent --show-error \
            "http://127.0.0.1:5173/api/v1/meta" \
            --output "${RUNNER_TEMP}/proxy-meta.json"

          curl --fail --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data @"${RUNNER_TEMP}/portion-request.json" \
            "http://127.0.0.1:5173/api/v1/calculations/food-portions" \
            --output "${RUNNER_TEMP}/proxy-result.json"

          python3 - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path
          import os

          temp = Path(os.environ["RUNNER_TEMP"])
          meta = json.loads((temp / "proxy-meta.json").read_text())
          result = json.loads((temp / "proxy-result.json").read_text())

          assert meta["application"] == "NutriCoach"
          assert Decimal(str(result["totals"]["CARBOHYDRATE"]["knownAmount"])) == Decimal("50")
          assert Decimal(str(result["totals"]["FAT"]["knownAmount"])) == Decimal("5")
          print("Frontend server and API proxy both returned the expected results.")
          PY

          echo "RUNTIME SMOKE TEST PASSED"
