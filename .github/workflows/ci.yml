name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  calculation-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run dependency-free calculation contract tests
        run: ./backend/scripts/run-core-tests.sh
      - name: Verify repository structure
        run: ./scripts/verify.sh

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test backend
        working-directory: backend
        run: mvn -B verify

  public-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Validate public demo JS and real data
        run: ./scripts/check-public-demo.sh
      - name: Validate food resolver aliases
        run: node scripts/test-food-resolver.js

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build web application
        working-directory: web
        run: npm run build
