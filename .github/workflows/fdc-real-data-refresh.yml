name: Refresh USDA real food catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1,15 * *"

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download official USDA datasets
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            -o foundation.zip \
            https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_foundation_food_json_2026-04-30.zip
          curl --fail --location --retry 4 --retry-all-errors \
            -o sr_legacy.zip \
            https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_sr_legacy_food_json_2018-04.zip
      - name: Build compact catalog
        run: |
          python scripts/build_fdc_catalog.py \
            --foundation-zip foundation.zip \
            --sr-legacy-zip sr_legacy.zip \
            --output public-demo/data/usda-food-catalog.json
      - name: Validate catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("public-demo/data/usda-food-catalog.json")
          d = json.loads(p.read_text())
          assert d["counts"]["emitted"] >= 5000
          assert d["sourcePolicy"]["values"] == "source-derived only; no synthetic nutrient values"
          print("USDA catalog records:", d["counts"]["emitted"])
          PY
      - name: Commit refreshed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-demo/data/usda-food-catalog.json
          if git diff --cached --quiet; then
            echo "No catalog changes."
            exit 0
          fi
          git commit -m "data: refresh USDA FoodData Central catalog"
          git push
